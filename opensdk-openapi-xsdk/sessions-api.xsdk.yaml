components:
  schemas:
    Session:
      type: object
      required:
        - id
        - visitor
        - status
      properties:
        id:
          type: string
          description: Unique session id
        visitor:
          $ref: '#/components/schemas/Visitor'
        status:
          type: string
          enum:
            - active
            - ended
        startedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
    Visitor:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        email:
          type: string
        country:
          type: string
    SessionInput:
      type: object
      required:
        - visitorId
      properties:
        visitorId:
          type: string
          description: The visitor starting the session
        metadata:
          type: object
          additionalProperties:
            type: string
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
